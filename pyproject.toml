[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-erc-research"
version = "0.1.0"
description = "Small decoder-only MoE research: Vanilla MoE versus ERC"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["moe_erc*"]
